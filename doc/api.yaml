openapi: 3.0.3
info:
  title: Wasa-Project
  description: |-
    Wasa Project OpenAPI document.
  version: "1"

security:
  - bearerAuth: []

paths:
  /session:
    post:
      security: 
        - bearerAuth: []
      tags: ["Login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    # change here if you decide to use an integer
                    # or any other type of identifier
                    type: string
                    example: "abcdef012345"

  /users/{user-id}:
    put:
      tags: ["User name"]
      summary: Set User Name
      description : |- 
        Sets the username. 
        Overwrites the previous one if it already exists.
      operationId: setMyUserName
      parameters: 
        - name: user-id
          in: path
          description: Identifier of the user to update
          required: true
          schema:
            type: string
            example: "abcdef012345"
      requestBody:
        description: New user name
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: User name updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
                  name:
                    type: string
                    example: Maria
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chats:
    get:
      security:
        - brToken: []
      tags: ["User conversations"]
      summary: Get User Conversations
      description: |-
        Return a list of the conversations belonging to the authenticated user.
        The user identity is derived from the Bearer Token.
      operationId: getMyConversations
      parameters:
        - name: num-conversations
          in: query
          description: "Limit of max conversations returned"
          required: false  
          schema: 
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100

      responses:  
        "200":
          description: Successfully returned list of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: 
                      type: string
                    title:
                      type: string
        '400':
          description: Invalid request (e.g. limit parameters error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token missing or invalid
          
  /chats/{chat-id}:
    get:
      tags: ["User conversations"]
      summary: Get current Conversation
      description: |-
        Return the current conversation...
      operationId: getConversation
      parameters:
        - name: chat-id
          in: path
          description: chat-id
          required: true
          schema: 
            type: string
            example: "abcdef012345"
        - name: limit
          in: query
          description: maximum number of messages to return
          required: false
          schema:   
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100
      responses:  
        '200':  
          description: Conversation details and messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "abcdef012345"
                  topic:
                    type: string
                    example: "Support Request #42"
                  createdAt:
                    type: string
                    format: date-time
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        sender:
                          type: string
                          enum: ["user", "bot", "agent"]
                        timestamp:
                          type: string
                          format: date-time

        '400':
          description: Invalid request (e.g. invalid format for chat-id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Unauthorized - Token missing
        
        '403':
          description: Forbidden - User does not belong to this chat

        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{message-id}:
    put: 
      tags: ["User conversations"]
      summary: Send or update a message
      description: |-
        Permette di inviare un messaggio con un ID specifico o aggiornarlo se esiste già.
      operationId: sendMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      requestBody: 
        description: Message payload to send
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  example: "AHAHAHAH"
                username:
                  type: string
                  example: "Maria"

      responses: 
        '200':
          description: Message sent or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Chat or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'   

  /groups/{group-id}:
    put:
      tags: ["Groups"]
      summary: Set Group Name
      description: Set the group name
      operationId: setGroupName
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: Group Name set or updated
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Programmazione Web"
                username:
                  type: string
                  example: "Maria"
  
  /groups/{group-id}/photo:
    put:

    delete:

  /groups/{group-id}/members:
    post:
      tags: ["Groups"]
      summary: Add to group
      description: Add a member to group
      operationId: addToGroup 
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: L'ID dell'utente da aggiungere al gruppo
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: L'ID dell'utente da aggiungere
                  example: "abcdef012345"
      responses:
        '200':
          description: Membro aggiunto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group' 
        '404':
          description: Gruppo o utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflitto - L'utente è già membro di questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: ["Groups"]
      summary: Leave Group
      description: Leave the current group
      operationId: leaveGroup
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: User left group successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User is not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{message-id}/forward:
    post:
      tags: ["Messages"]
      summary: Forward Message
      description: Forward a message from a chat to another
      operationId: forwardMessage
      security:
        - brToken: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: Destination chat and forwarding options
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetChatId
              properties:
                targetChatId:
                  type: string
                  description: Identifier of the destination chat
                  example: "chat0123456"
                keepSender:
                  type: boolean
                  description: Preserve original sender when forwarding
                  default: true
      responses:
        '200':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  forwardedMessageId:
                    type: string
                    example: "msg987654"
                  message:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token missing or invalid
        '404':
          description: Message or target chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Message already exists in target chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      
  /message/{message-id}/comment:
    post:
      tags: ["Messages"]
      summary: Comment Message
      description: Add a comment to a message
      operationId: commentMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: The comment payload
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commentId
                - text
              properties: 
                commentId:
                  type: string
                  description: Comment identifier
                  example: "comment01233456"
                text:
                  type: string
                  description: "Content of the comment"
                  example: "AHAHAHAH"
                  minLength: 1
      responses:
        '201':  
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  commentId:
                    type: string
                    example: "comment01233456"
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid input 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: ["Messages"]
      summary: Uncomment message
      description: Remove a comment from a message
      operationId: uncommentMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Message or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth: 
      type: http
      scheme: bearer
      bearerFormat: JWT 

  schemas:
    User:
      type: object
      properties:
        identifier:
          type: string
          example: "abcdef012345"
        name:
          type: string
          example: "Maria"
      required:
        - identifier
        - name
    Message:  
      type: object
      properties:
        messageId:
          type: string
          example: "msg01234567"
        text:
          type: string
          example: "Ciao! Come stai?"
        user:
          type: string
          example: "MarioRossi"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - messageId
        - text
        - user
        - createdAt
        - updateAt
    
    Group:
      type: object
      properties:
        groupId:
          type: string
          example: "group012345"
        groupName:
          type: string
          example: "Programmazione Web"
        description:
          type: string
          example: "Gruppo relativo al corso di Programmazione Web"
        members:
          type: array
          items:
            type: string
          example: ["abcdef012345", "abcdef012346"]
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties: 
        error-id:
          type: integer
          example: 404
        message:
          type: string
          example: User not found
    
  parameters: 
    UserId:
      name: user-id
      in: path
      description: "User Identifier"
      required: true
      schema:
        type: string
        example: "abcdef012345"
    GroupId:
      name: group-id
      in: path
      description: "Group Identifier"
      required: true
      schema:
        type: string
        example: "group012345"
    ChatId:
      name: chat-id
      in: path
      description: "Chat Identifier"
      required: true
      schema:
        type: string
        example: "chat012345"
    MessageId:
      name: message-id
      in: path
      description: "Message Identifier"
      required: true
      schema:
        type: string
        example: "msg01234567"

