openapi: 3.0.3
info:
  title: Wasa-Project
  description: |-
    Wasa Project OpenAPI document.
  version: "1"

servers:
  - url: http://localhost:3000/v1
    description: Server di sviluppo locale

tags:
  - name: Login
    description: Gestione autenticazione
  - name: Users
    description: Operazioni sugli utenti
  - name: User conversations
    description: Recupero chat e conversazioni
  - name: Messages
    description: Invio e gestione messaggi
  - name: Groups
    description: Gestione dei gruppi
  - name: Photo
    description: Gestione immagini profilo e gruppi

security:
  - bearerAuth: []

paths:
  /session:
    post:
      security: []
      tags: ["Login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome utente
                  example: Maria
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - identifier
                  - token
                properties:
                  identifier:
                    type: string
                    description: Identificatore utente
                    example: "abcdef012345"
                    minLength: 5
                    maxLength: 10
                  token: 
                    type: string
                    description: Il bearer token da usare per l'autorizzazione
                    example: "GciOiJIUzI1NiIsInR5cCI6IkpXVCJ"
                    minLength: 30
                    maxLength: 30

  /users/{userId}:
    put:
      tags: ["Users"]
      summary: Set User Name
      description : |- 
        Imposta il nome utente. Sovrascrive quello precedente se esiste già.
      operationId: setMyUserName
      parameters: 
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: Nuovo nome utente
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome utente
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: Nome utente aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Richiesta non valida / Errore di validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /users/{userId}/photo:
    put:
      tags: ["Users","Photo"]
      summary: Set User photo
      description: |- 
        Aggiunge la foto profilo utente se non presente, 
        altrimenti la aggiorna. 
        Accetta immagini in formato PNG o JPEG.
      operationId: setMyPhoto
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:  
        description: L'immagine del profilo da caricare (in byte)
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: foto in formato png
          image/jpeg:
            schema:
              type: string
              format: binary
              description: foto in formato jpeg
      responses:
        '200':
          description: Foto aggiornata con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Messaggio di conferma operazione
                    example: "Foto profilo aggiornata correttamente"
              example:
                message: "Foto profilo aggiornata correttamente"
        '400':
          description: Formato immagine non valido o file troppo grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Non puoi modificare la foto di un altro utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore interno durante il salvataggio dell'immagine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chats:
    get:
      tags: ["User conversations"]
      summary: Get User Conversations
      description: |-
        Restituisce una lista delle conversazioni appartenenti all'utente autenticato. 
        La lista è ordinata in ordine cronologico inverso (dal più recente al più vecchio) basandosi sul campo 'modifiedAt'.
        L'identità dell'utente è derivata dal Bearer Token.
      operationId: getMyConversations
      parameters:
        - name: num-conversations
          in: query
          description: Il numero massimo di conversazioni ritornate.
          required: false  
          schema: 
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100

      responses:  
        "200":
          description: Lista di conversazioni ritornata con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    description: Lista delle conversazioni dell'utente
                    items:
                      type: object
                      properties:
                        chatId:
                          type: string
                          description: Identificatore univoco della conversazione
                        title:
                          type: string
                          description: Titolo o argomento della conversazione
                        lastMessage:
                          $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request (e.g. limit parameters error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token missing or invalid
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          
  /chats/{chatId}:
    get:
      tags: ["User conversations"]
      summary: Get current Conversation
      description: |-
        Ritorna la conversazione corrente
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: limit
          in: query
          description: Numero massimo di messaggi da ritornare
          required: false
          schema:   
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100

      responses:  
        '200':  
          description: Conversation details and messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

        '400':
          description: Invalid request (e.g. invalid format for chatId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Unauthorized - Token missing
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        
        '403':
          description: Forbidden - User does not belong to this chat
          content:                        
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages:
    post: 
      tags: ["Messages"]
      summary: Invia un messaggio
      description: |-
        Permette di inviare un messaggio con un ID specifico.
      operationId: sendMessage
      requestBody: 
        description: Contenuto del messaggio da inviare
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chatId
                - text
              properties:
                chatId: 
                  type: string
                  description: |- 
                    Identificatore della conversazione. 
                  example: "chat012345"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 5
                  maxLength: 10
                text:
                  type: string
                  description: Contenuto testuale del messaggio
                  pattern: '^[\s\S]*$'
                  example: "Ciao, come stai?"
                  minLength: 1
                  maxLength: 1000
      responses: 
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Chat or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  

  /messages/{messageId}:
    parameters: 
      - $ref: '#/components/parameters/MessageId'
    put: 
      tags: ["Messages"]
      summary: Modifica un messaggio
      description: |-
        Permette di Modificare un messaggio con un ID specifico.
      operationId: updateMessage
      
      requestBody: 
        description: Contenuto del messaggio da modificare
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Contenuto testuale del messaggio
                  pattern: '^[\s\S]*$'
                  example: "Ciao, come stai?"
                  minLength: 1
                  maxLength: 1000
      responses: 
        '200':
          description: Message updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Chat or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  
    delete:
      tags: ["Messages"]
      summary: Cancella il messaggio
      description: Cancella il messaggio. Ritorna l'id del messaggio
      operationId: deleteMessage
      responses:
        '200':
          description: Messaggio cancellato con successo. Ritorna l'ID del messaggio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                    description: L'ID del messaggio che è stato eliminato
                    example: "msg01234567"
                    pattern: '^[a-zA-Z0-9]+$'
                    minLength: 5
                    maxLength: 10
        '403':
          description: Forbidden - Non hai i permessi per cancellare questo messaggio (non è tuo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Messaggio non trovato (o già cancellato)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{messageId}/status:
    put:
      tags: ["Messages"]
      summary: Aggiorna lo stato del messaggio
      description: |-
        Aggiorna lo stato del messaggio da ["sent" -> "received" -> "read"]
      operationId: updateMessageStatus
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      requestBody:  
        description: Nuovo stato del messaggio
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: ["received", "read"]
                  example: "received"
      responses:  
        '200':
          description: Stato del messaggio aggionato con successo
          content:
            application/json:
              schema:
                type: object
                required:
                  - updatedAt
                properties:
                  updatedAt:
                    type: string
                    format: date-time
                    description: Il momento in cui lo stato è stato aggionato
        '400':
          description: Stato non valido o transizione illegale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Messaggio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{messageId}/forward:
    post:
      tags: ["Messages"]
      summary: Inoltra il messaggio
      description: Inoltra il messaggio ad un'altra chat
      operationId: forwardMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: Chat di destinazione e opzioni di inoltro
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetChatId
              properties:
                targetChatId:
                  type: string
                  description: Identifier of the destination chat
                  example: "chat0123456"
                keepSender:
                  type: boolean
                  description: Preserve original sender when forwarding
                  default: true
      responses:
        '200':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token missing or invalid
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Message or target chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Conflict - Message already exists in target chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /messages/{messageId}/comments:
    post:
      tags: ["Messages"]
      summary: Commenta un messaggio
      description: Aggiunge un commento ad un messaggio
      operationId: commentMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: Il contenuto del commento
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
                - sender
              properties: 
                emoji:
                  type: string
                  description: emoji inviata
                  minLength: 1
                  maxLength: 300
                sender: 
                  type: string
                  description: L'ID dell'utente che ha lasciato il commento
                  example: "user123456"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 5
                  maxLength: 10
      responses:
        '201':  
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      
  /message/{messageId}/comments/{commentId}:
    delete:
      tags: ["Messages"]
      summary: Cancella Commento
      description: Rimuovi il commento dal messaggio
      operationId: uncommentMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Comment deleted successfully      
        '404':
          description: Message or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 

  /groups/{groupId}:
    put:
      tags: ["Groups"]
      summary: Set Group Name
      description: Set the group name
      operationId: setGroupName
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: Group Name set or updated
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Informazioni sul nuovo nome da sostituire
              properties:
                name:
                  type: string
                  description: Nuovo nome del gruppo
                  example: "Programmazione Web"
                  minLength: 1
                  maxLength: 30
                username:
                  type: string
                  description: Username dell'utente che effettua la modifica
                  example: "Maria"
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 16
      responses:
        '200':
          description: Nome del gruppo aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Richiesta non valida (es. nome vuoto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accesso Negato - Non hai i permessi per modificare questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  
  /groups/{groupId}/photo:
    put:
      tags: ["Groups","Photo"]
      summary: Set group photo
      description: Set the group photo
      operationId: setGroupPhoto
      parameters: 
        - $ref: '#/components/parameters/GroupId'
      requestBody:  
        description: L'immagine del profilo da caricare
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: foto in formato png
              minLength: 1
              maxLength: 500
          image/jpeg:
            schema:
              type: string
              format: binary
              description: foto in formato jpeg
              minLength: 1
              maxLength: 500
      responses:
        '200':
          description: Foto aggiornata con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Group'
        '400':
          description: Formato immagine non valido o file troppo grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Non puoi modificare la foto di un altro utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore interno durante il salvataggio dell'immagine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /groups/{groupId}/members:
    post:
      tags: ["Groups"]
      summary: Add to group
      description: Add a member to group
      operationId: addToGroup 
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: L'ID dell'utente da aggiungere al gruppo
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Informazioni sul membro da aggiungere al gruppo
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: L'ID dell'utente da aggiungere
                  example: "abcd0123"
                  minLength: 5
                  maxLength: 10
      responses:
        '201':
          description: Membro aggiunto con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group' 
        '404':
          description: Utente o gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflitto - L'utente è già un membro del gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members/{memberId}:
  #controllo in back-end che memberId sia uguale all'ID dell'utente connesso
    delete:
      tags: ["Groups"]
      summary: Leave Group
      description: |- 
        Lascia il gruppo corrente
        Il `memberId` nel percorso DEVE corrispondere all'identificatore dell'utente autenticato (ricavato dal Bearer Token). 
        Non è possibile rimuovere altri utenti.
      operationId: leaveGroup
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: User left group successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Richiesta non valida (es. ID malformati)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Stai cercando di rimuovere un utente diverso da te stesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: L'utente non è un membro di questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  securitySchemes:
    bearerAuth: 
      type: http
      scheme: bearer
      bearerFormat: JWT 
      description: |-
        Autenticazione basata su JWT. 
        Effettua la chiamata a POST /session per ottenere il token, 
        poi inseriscilo nell'header come: Authorization: Bearer <tuo_token>

  schemas:
    User:
      type: object
      description: Rappresenta un utente
      properties:
        identifier:
          type: string
          description: Identificatore dell'utente
          example: "abcd0123"
          minLength: 5
          maxLength: 10
        name:
          type: string
          description: Nome dell'utente
          example: "Maria"
          minLength: 1
          maxLength: 15
      required:
        - identifier
        - name

    Message:  
      type: object
      description: Rappresenta un messaggio presente in una chat
      properties:
        messageId:
          type: string
          description: Identificatore del messaggio
          example: "msg012345"
          minLength: 5
          maxLength: 10
        state:
          type: string
          enum: ["sent","received","read"]
          description: Stato del messaggio [inviato,ricevuto,letto]
          example: "read"
          default: "sent"
        contentType:
          type: string
          description: "Tipo di messaggio. Default: text"
          enum: ["text", "image","audio"]
          default: "text"
          example: "text"
        photoUrl:
          type: string
          description: "URL o ID dell'immagine (se contentType è image)"
          example: "img_12345.jpg"
        text:
          type: string
          description: Corpo del messaggio
          example: "AHAHAHAH"
          minLength: 1
          maxLength: 1000
        senderId:
          type: string
          description: Identificatore dell'utente che ha inviato il messaggio
          example: "abcd0123"
          minLength: 5
          maxLength: 10
        createdAt:
          type: string
          description: Quando il messaggio è stato scritto per la prima volta
          format: date-time
        updatedAt:
          type: string
          description: Quando il messaggio è stato modificato per l'ultima volta
          format: date-time
      required:
        - messageId
        - state
        - text
        - senderId
        - createdAt
        - updatedAt
    
    Comment:
      type: object
      description: |-
        Rappresenta un commento rappresentato come emoticon
      properties:
        commentId:
          type: string
          description: L'ID del commento appena creato
          example: "comment01233456"
        emoji:
          type: string
          description: L'emoticon inviata
          minLength: 1
          maxLength: 300
        senderId:
          type: string
          description: L'ID dell'utente che ha lasciato il commento
          example: "user123456"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 5
          maxLength: 10
        createdAt:
          type: string
          description: Data di creazione del commento
          format: date-time
      required:
        - commentId
        - emoji
        - senderId
        - createdAt
    
    Group:
      type: object
      description: Rappresenta un gruppo
      properties:
        groupId:
          type: string
          description: Identificatore del gruppo
          example: "group0123"
          minLength: 5
          maxLength: 10
        groupName:
          type: string
          description: Nome del gruppo
          example: "Programmazione Web"
          pattern: '^[\s\S]*$'
          minLength: 1
          maxLength: 25
        groupDescription:
          type: string
          description: Descrizione del gruppo
          pattern: '^[\s\S]*$'
          example: "Gruppo del corso di Programmazione Web"
          minLength: 1
          maxLength: 50
        members:
          type: array
          description: Array che rappresenta tutti i membri appartenenti al gruppo
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/User'
          example: 
            - identifier: "abcdef0123"
              name: "Maria"
            - identifier: "xyz9876543"
              name: "Luca"
        createdAt:
          type: string
          description: Quando il gruppo è stato creato
          format: date-time
      required:
        - groupId
        - groupName
        - members
        - createdAt

    Chat:
      type: object
      description: Schema che rappresenta una chat dell'utente
      properties: 
        messages:  
          type: array
          description: Array contenente i messaggi della chat
          minItems: 0
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Message'
        createdAt:
          type: string
          description: Quando la chat è stata creata
          format: date-time
        modifiedAt:
          type: string
          description: Quando è stato inviato l'ultimo messaggio
          format: date-time
      required:
        - messages
        - createdAt
        - modifiedAt

    Error:
      type: object
      description: Schema che rappresenta un errore ritornato da un'operazione
      properties: 
        errorId:
          type: integer
          description: Identificatore dell'errore
          example: 404
        error:
          type: string
          description: Corpo del'errore
          example: "User not found"
          minLength: 1
          maxLength: 100
      required:
        - errorId
        - error
    
  parameters: 
    UserId:
      name: userId
      in: path
      description: Identificatore dell'utente
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "abcdf0123"
        minLength: 5
        maxLength: 10
    GroupId:
      name: groupId
      in: path
      description: Identificatore di un gruppo
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "group12345"
        minLength: 5
        maxLength: 10
    MemberId:
      name: memberId
      in: path
      description: Identificatore di un membro di un gruppo
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "mem1234567"
        minLength: 5
        maxLength: 10
    ChatId:
      name: chatId
      in: path
      description: Identificatore della chat
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "chat012345"
        minLength: 5
        maxLength: 10
    MessageId:
      name: messageId
      in: path
      description: Identificatore di un messaggio
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "msg0123456"
        minLength: 5
        maxLength: 10
    CommentId: 
      name: commentId
      in: path
      description: Identificatore di un commento
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "com0123456"
        minLength: 5
        maxLength: 10