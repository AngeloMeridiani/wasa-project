openapi: 3.0.3
info:
  title: Wasa-Project
  description: |-
    Wasa Project OpenAPI document.
    Documentazione API per l'applicazione di messaggistica Wasa.
  version: "1"

servers:
  - url: http://localhost:3000/v1
    description: Server di sviluppo locale

tags:
  - name: Login
    description: Gestione autenticazione e sessioni
  - name: Users
    description: Operazioni e gestione profili utenti
  - name: Chats
    description: Recupero chat e conversazioni
  - name: Messages
    description: Invio, modifica e gestione dei messaggi
  - name: Groups
    description: Gestione dei gruppi e dei membri
  - name: Photo
    description: Gestione immagini profilo e gruppi

security:
  - bearerAuth: []

paths:
  /session:
    post:
      security: []
      tags: ["Login"]
      summary: Login utente
      description: |-
        Effettua il login dell'utente.
        Se l'utente non esiste, viene creato e viene restituito un identificatore.
        Se l'utente esiste, viene restituito il suo identificatore esistente.
      operationId: doLogin
      requestBody:
        description: Dettagli dell'utente per il login
        content:
          application/json:
            schema:
              type: object
              description: Oggetto contenente i dati di login
              properties:
                name:
                  type: string
                  description: Nome utente scelto
                  example: Maria
                  pattern: '^[a-zA-Z0-9_]+$'
                  minLength: 3
                  maxLength: 25
        required: true
      responses:
        '201':
          description: Login effettuato con successo
          content:
            application/json:
              example:
                identifier: "abcdef0123abcdef0123"
              schema:
                type: object
                description: Dati della sessione creata
                required:
                  - identifier
                properties:
                  identifier:
                    type: string
                    description: Identificatore univoco dell'utente usato come token
                    example: "abcdef0123abcdef0123"
                    pattern: '^[a-zA-Z0-9]+$'
                    minLength: 20
                    maxLength: 20

  /users/{userId}:
    put:
      tags: ["Users"]
      summary: Imposta nome utente
      description : |- 
        Imposta o aggiorna il nome utente. Sovrascrive quello precedente se esiste già.
      operationId: setMyUserName
      parameters: 
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: Nuovo nome utente da impostare
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Oggetto contenente il nuovo nome
              required:
                - name
              properties:
                name:
                  type: string
                  description: Il nuovo nome utente desiderato
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 25
      responses:
        '200':
          description: Nome utente aggiornato con successo
          content:
            application/json:
              example:
                userId: "abcd012345abcd012345"
                name: "Maria"
                userPhoto: "img_user_1234567.jpg"
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Richiesta non valida (es. nome troppo corto o caratteri non validi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /users/{userId}/photo:
    put:
      tags: ["Users","Photo"]
      summary: Imposta foto profilo
      description: |- 
        Aggiunge la foto profilo utente se non presente, 
        altrimenti la aggiorna. 
        Accetta immagini in formato PNG o JPEG.
      operationId: setMyPhoto
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:  
        description: L'immagine del profilo da caricare (in formato binario)
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Oggetto contenente il link alla foto
              required:
                - photoUrl
              properties:
                photoUrl:
                  type: string
                  description: L'URL dell'immagine
                  example: "img_user_1234567.png"
                  pattern: '^[a-zA-Z0-9_]+\.(jpg|jpeg|png)$'
                  minLength: 10
                  maxLength: 50
      responses:
        '200':
          description: Foto aggiornata con successo
          content:
            application/json:
              example:
                userId: "abcd012345abcd012345"
                name: "Maria"
                userPhoto: "img_user_1234567.png"
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Formato immagine non valido o file troppo grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Non puoi modificare la foto di un altro utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore interno durante il salvataggio dell'immagine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chats:
    post:
      tags: ["Chats"]
      summary: Crea nuova chat
      description: |-
        Crea una nuova conversazione con un altro utente.
        Se esiste già una chat attiva con questo utente, il server restituisce quella esistente.
      operationId: createChat
      requestBody:
        description: Dati necessari per creare la chat
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload per la creazione della chat
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  description: L'identificatore dell'utente con cui vuoi iniziare la conversazione
                  example: "abcd012345abcd012345"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 20
                  maxLength: 20
      responses:
        '201':
          description: Chat creata con successo
          content:
            application/json:
              example:
                messages: []
                createdAt: "2024-04-01T12:00:00Z"
                modifiedAt: "2024-04-01T12:00:00Z"
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Richiesta non valida (es. provi a chattare con te stesso o ID non valido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorizzato - Token mancante o non valido
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente target non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: ["Chats"]
      summary: Ottieni le chat
      description: |-
        Restituisce una lista delle conversazioni appartenenti all'utente autenticato. 
        La lista è ordinata in ordine cronologico inverso (dal più recente al più vecchio).
      operationId: getMyConversations
      parameters:
        - name: num-conversations
          in: query
          description: Il numero massimo di conversazioni da ritornare (paginazione).
          required: false  
          schema: 
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100

      responses:  
        "200":
          description: Lista di conversazioni ritornata con successo
          content:
            application/json:
              example:
                chats:
                  - chatId: "chat012345chat012345"
                    title: "Maria"
                    lastMessage:
                      messageId: "msg0123456msg0123456"
                      chatId: "chat012345chat012345"
                      state: "sent"
                      senderId: "abcd012345abcd012345"
                      createdAt: "2024-04-01T12:00:00Z"
                      updatedAt: "2024-04-01T12:00:00Z"
                      contentType: "text"
                      text: "Ciao, come stai?"
              schema:
                type: object
                description: Contenitore della lista delle conversazioni
                properties:
                  chats:
                    type: array
                    minItems: 1
                    maxItems: 100
                    description: Lista delle conversazioni dell'utente
                    items:
                      type: object
                      description: Oggetto di anteprima della conversazione
                      properties:
                        chatId:
                          type: string
                          description: Identificatore univoco della conversazione
                        title:
                          type: string
                          description: Titolo o argomento della conversazione (es. nome del gruppo o dell'altro utente)
                        lastMessage:
                          $ref: '#/components/schemas/Message'
        '400':
          description: Richiesta non valida (es. parametri di limite errati)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorizzato - Token mancante o non valido
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          
  /chats/{chatId}:
    get:
      tags: ["Chats"]
      summary: Ottieni una conversazione specifica
      description: |-
        Ritorna i dettagli e i messaggi della conversazione corrente.
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: limit
          in: query
          description: Numero massimo di messaggi da ritornare per questa chat
          required: false
          schema:   
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100

      responses:  
        '200':  
          description: Dettagli della conversazione e messaggi recuperati con successo
          content:
            application/json:
              example:
                messages:
                  - "msg0123456msg0123456"
                createdAt: "2024-04-01T12:00:00Z"
                modifiedAt: "2024-04-01T12:00:00Z"
              schema:
                $ref: '#/components/schemas/Chat'

        '400':
          description: Richiesta non valida (es. formato chatId errato)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Non autorizzato - Token mancante
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        
        '403':
          description: Forbidden - L'utente non partecipa a questa chat
          content:                        
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Conversazione non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages:
    post: 
      tags: ["Messages"]
      summary: Invia un messaggio
      description: |-
        Permette di inviare un nuovo messaggio in una chat specifica.
      operationId: sendMessage
      requestBody: 
        description: Contenuto del messaggio da inviare
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload per l'invio del messaggio
              required:
                - chatId
                - text
              properties:
                chatId: 
                  type: string
                  description: |- 
                    Identificatore della conversazione di destinazione. 
                  example: "chat012345chat012345"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 20
                  maxLength: 20
                text:
                  type: string
                  description: Contenuto testuale del messaggio
                  pattern: '^[\s\S]*$'
                  example: "Ciao, come stai?"
                  minLength: 1
                  maxLength: 2000
      responses: 
        '201':
          description: Messaggio inviato con successo
          content:
            application/json:
              example:
                messageId: "msg0123456msg0123456"
                chatId: "chat012345chat012345"
                state: "sent"
                senderId: "abcd012345abcd012345"
                createdAt: "2024-04-01T12:00:00Z"
                updatedAt: "2024-04-01T12:00:00Z"
                contentType: "text"
                text: "Ciao, come stai?"
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Chat non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  

  /messages/{messageId}:
    parameters: 
      - $ref: '#/components/parameters/MessageId'
    put: 
      tags: ["Messages"]
      summary: Modifica un messaggio
      description: |-
        Permette di modificare il testo di un messaggio esistente.
      operationId: updateMessage
      requestBody: 
        description: Contenuto del messaggio aggiornato
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload per la modifica del messaggio
              properties:
                text:
                  type: string
                  description: Nuovo contenuto testuale del messaggio
                  pattern: '^[\s\S]*$'
                  example: "Ciao, tutto bene?"
                  minLength: 1
                  maxLength: 2000
      responses: 
        '200':
          description: Messaggio aggiornato con successo
          content:
            application/json:
              example:
                messageId: "msg0123456msg0123456"
                chatId: "chat012345chat012345"
                state: "sent"
                senderId: "abcd012345abcd012345"
                createdAt: "2024-04-01T12:00:00Z"
                updatedAt: "2024-04-01T12:10:00Z"
                contentType: "text"
                text: "Ciao, tutto bene?"
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Messaggio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  
    delete:
      tags: ["Messages"]
      summary: Cancella messaggio
      description: Cancella il messaggio specificato. Ritorna l'id del messaggio eliminato.
      operationId: deleteMessage
      responses:
        '200':
          description: Messaggio cancellato con successo.
          content:
            application/json:
              example:
                messageId: "msg0123457msg0123457"
              schema:
                type: object
                description: Conferma cancellazione con ID
                properties:
                  messageId:
                    type: string
                    description: L'ID del messaggio che è stato eliminato
                    example: "msg0123457msg0123457"
                    pattern: '^[a-zA-Z0-9]+$'
                    minLength: 20
                    maxLength: 20
        '403':
          description: Forbidden - Non hai i permessi per cancellare questo messaggio (non è tuo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Messaggio non trovato (o già cancellato)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{messageId}/status:
    put:
      tags: ["Messages"]
      summary: Aggiorna lo stato del messaggio
      description: |-
        Aggiorna lo stato del messaggio seguendo il flusso: "sent" -> "received" -> "read".
      operationId: updateMessageStatus
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      requestBody:  
        description: Nuovo stato da applicare al messaggio
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload per l'aggiornamento dello stato
              required:
                - status
              properties:
                status:
                  type: string
                  description: Il nuovo stato (received o read)
                  enum: ["received", "read"]
                  example: "received"
      responses:  
        '200':
          description: Stato del messaggio aggiornato con successo
          content:
            application/json:
              example:
                updatedAt: "2024-04-01T12:15:00Z"
              schema:
                type: object
                description: Conferma con timestamp
                required:
                  - updatedAt
                properties:
                  updatedAt:
                    type: string
                    format: date-time
                    description: Il momento esatto in cui lo stato è stato aggiornato
        '400':
          description: Stato non valido o transizione illegale (es. da read a sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Messaggio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{messageId}/forward:
    post:
      tags: ["Messages"]
      summary: Inoltra il messaggio
      description: Inoltra un messaggio esistente ad un'altra chat di destinazione.
      operationId: forwardMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: Dettagli per l'inoltro (destinazione)
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload per l'inoltro
              required:
                - targetChatId
              properties:
                targetChatId:
                  type: string
                  description: Identificatore della chat di destinazione
                  example: "chat012345chat012345"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 20
                  maxLength: 20
      responses:
        '200':
          description: Messaggio inoltrato con successo
          content:
            application/json:
              example:
                messageId: "msg0123458msg0123458"
                chatId: "chat012346chat012346"
                state: "sent"
                senderId: "abcd012345abcd012345"
                createdAt: "2024-04-01T12:20:00Z"
                updatedAt: "2024-04-01T12:20:00Z"
                contentType: "text"
                text: "Messaggio inoltrato"
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorizzato - Token mancante o non valido
          content:                         
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Messaggio originale o chat di destinazione non trovati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /messages/{messageId}/comments:
    post:
      tags: ["Messages"]
      summary: Commenta un messaggio
      description: Aggiunge un commento (reazione emoji) ad un messaggio.
      operationId: commentMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        description: Il contenuto del commento (emoji)
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload del commento
              required:
                - emoji
              properties: 
                emoji:
                  type: string
                  description: L'emoji inviata come reazione
                  example: "emoji_1234.jpg"
                  pattern: '^[a-zA-Z0-9_]+\.(jpg|jpeg|png)$'
                  minLength: 5
                  maxLength: 50
      responses:
        '201':  
          description: Commento creato con successo
          content:
            application/json:
              example:
                commentId: "comm012334comm012334"
                messageId: "msg0123456msg0123456"
                emojiSent: "emoji_1234.jpg"
                senderId: "user123456user123456"
                createdAt: "2024-04-01T12:25:00Z"
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Input non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Messaggio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      
  /messages/{messageId}/comments/{commentId}:
    delete:
      tags: ["Messages"]
      summary: Cancella Commento
      description: Rimuove un commento (reazione) specifico dal messaggio.
      operationId: uncommentMessage
      parameters: 
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Commento cancellato con successo (Nessun contenuto ritornato)      
        '404':
          description: Messaggio o commento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 
  /groups:
    post:
      tags: ["Groups"]
      summary: Crea un nuovo gruppo
      description: |-
        Crea e restituisce un nuovo gruppo. 
      operationId: createGroup
      requestBody:  
        description: Dati del nuovo gruppo da creare
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dati del gruppo
              required: 
                - groupName
                - userId
              properties: 
                groupName:
                  type: string
                  description: Nome visualizzato del gruppo
                  example: "Programmazione Web"
                  pattern: '^[\s\S]*$'
                  minLength: 1
                  maxLength: 25
                groupDescription:
                  type: string
                  description: Descrizione o topic del gruppo
                  pattern: '^[\s\S]*$'
                  example: "Gruppo del corso di Programmazione Web"
                  minLength: 1
                  maxLength: 50
                userId:
                  type: string
                  description: Identificatore dell'utente che effettua la modifica 
                  pattern: '^[a-zA-Z0-9]+$'
                  example: "abcdf01234abcdf01234"
                  minLength: 20
                  maxLength: 20
      responses:
        '201':
          description: Gruppo creato con successo
          content:
            application/json:
              example:
                groupId: "group01234group01234"
                groupName: "Programmazione Web"
                members: ["abcd012345abcd012345"]
                createdAt: "2024-04-01T10:00:00Z"
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Dati input non validi (es. nome mancante o formato errato)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorizzato - Token mancante o non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utente creatore non trovato (l'ID specificato non esiste)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore interno durante la creazione del gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /groups/{groupId}:
    put:
      tags: ["Groups"]
      summary: Imposta nome gruppo
      description: Modifica il nome del gruppo specificato.
      operationId: setGroupName
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: Nuovo nome del gruppo
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dati per la modifica del nome del gruppo
              properties:
                name:
                  type: string
                  description: Nuovo nome del gruppo
                  example: "Programmazione Web"
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 30
                userId:
                  type: string
                  description: Identificatore dell'utente che effettua la modifica 
                  example: "abcde12345abcde12345"
                  pattern: '^.*?$'
                  minLength: 20
                  maxLength: 20
      responses:
        '200':
          description: Nome del gruppo aggiornato con successo
          content:
            application/json:
              example:
                groupId: "group01234group01234"
                groupName: "Programmazione Web"
                members: ["abcd012345abcd012345"]
                createdAt: "2024-04-01T10:00:00Z"
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Richiesta non valida (es. nome vuoto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accesso Negato - Non hai i permessi per modificare questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  
  /groups/{groupId}/photo:
    put:
      tags: ["Groups","Photo"]
      summary: Imposta foto gruppo
      description: Imposta o aggiorna l'immagine del gruppo.
      operationId: setGroupPhoto
      parameters: 
        - $ref: '#/components/parameters/GroupId'
      requestBody:  
        description: L'immagine del gruppo da caricare
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Oggetto contenente l'url alla foto
              required:
                - photoUrl
              properties:
                photoUrl:
                  type: string
                  description: L'URL dell'immagine
                  example: "img_group_123456.jpg"
                  pattern: '^img_[a-z]+_\d+\.(jpg|jpeg|png)$'
                  minLength: 10
                  maxLength: 50
      responses:
        '200':
          description: Foto del gruppo aggiornata con successo
          content:
            application/json:
              example:
                groupId: "group01234group01234"
                groupName: "Programmazione Web"
                groupPhoto: "img_group_123456.jpg"
                members: ["abcd012345abcd012345"]
                createdAt: "2024-04-01T10:00:00Z"
              schema: 
                $ref: '#/components/schemas/Group'
        '400':
          description: Formato immagine non valido o file troppo grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Non hai i permessi per modificare questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore interno durante il salvataggio dell'immagine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /groups/{groupId}/members:
    post:
      tags: ["Groups"]
      summary: Aggiungi al gruppo
      description: Aggiunge un utente esistente come membro di un gruppo.
      operationId: addToGroup 
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        description: Dettagli dell'utente da aggiungere
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload contenente l'ID dell'utente
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: L'ID dell'utente da aggiungere
                  example: "abcd012345abcd012345"
                  pattern: '^[a-zA-Z0-9]+$'
                  minLength: 20
                  maxLength: 20
      responses:
        '201':
          description: Membro aggiunto con successo
          content:
            application/json:
              example:
                groupId: "group01234group01234"
                groupName: "Programmazione Web"
                members: ["abcd012345abcd012345", "user123456user123456"]
                createdAt: "2024-04-01T10:00:00Z"
              schema:
                $ref: '#/components/schemas/Group' 
        '404':
          description: Utente o gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflitto - L'utente è già un membro del gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members/{memberId}:
    delete:
      tags: ["Groups"]
      summary: Lascia il gruppo
      description: |- 
        L'utente corrente abbandona il gruppo.
        Il `memberId` nel percorso DEVE corrispondere all'identificatore 
        dell'utente autenticato (ricavato dal Bearer Token). 
      operationId: leaveGroup
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: L'utente ha lasciato il gruppo con successo
          content:
            application/json:
              example:
                groupId: "group01234group01234"
                groupName: "Programmazione Web"
                members: ["user123456user123456"]
                createdAt: "2024-04-01T10:00:00Z"
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Richiesta non valida (es. ID malformati)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Stai cercando di rimuovere un utente diverso da te stesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppo non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: L'utente non è un membro di questo gruppo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  securitySchemes:
    bearerAuth: 
      type: http
      scheme: bearer
      description: |-
        Effettua la chiamata a POST /session per ottenere il token, 
        poi inseriscilo nell'header come: Authorization: Bearer <tuo_token>

  schemas:
    User:
      type: object
      description: Rappresenta un utente registrato nella piattaforma
      properties:
        userId:
          type: string
          description: Identificatore univoco dell'utente
          example: "abcd012345abcd012345"
          minLength: 20
          maxLength: 20
        name:
          type: string
          description: Nome pubblico dell'utente
          example: "Maria"
          minLength: 3
          maxLength: 25
        userPhoto:
          type: string
          description: "ID o URL della risorsa immagine. Se null, l'utente non ha foto."
          example: "img_user_1234567.jpg"
          pattern: ^img_[a-z]+_\d+\.(jpg|jpeg|png)$
          minLength: 20
          maxLength: 50
      required:
        - userId
        - name

    Message:  
      type: object
      description: Rappresenta un singolo messaggio all'interno di una chat
      properties:
        messageId:
          type: string
          description: Identificatore univoco del messaggio
          example: "msg0123456msg0123456"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
        chatId:
          type: string
          description: Identificatore univoco della chat a cui appartiene il messaggio
          example: "chat012345chat012345"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
        state:
          type: string
          enum: ["sent","received","read"]
          description: Stato di consegna del messaggio [inviato, ricevuto dal server, letto dal destinatario]
          example: "read"
          default: "sent"
        senderId:
          type: string
          description: Identificatore dell'utente che ha inviato il messaggio
          example: "abcd012345abcd012345"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
        createdAt:
          type: string
          description: Timestamp di creazione del messaggio
          format: date-time
        updatedAt:
          type: string
          description: Timestamp dell'ultima modifica al messaggio
          format: date-time
      oneOf:
        - title: Messaggio di Testo
          required: [contentType, text] 
          properties:
            contentType:
              type: string
              description: Contenuto testuale
              enum: ["text"]
            text:
              type: string
              description: Testo del messaggio
              minLength: 1
              maxLength: 2000
        - title: Messaggio Immagine
          required: [contentType, photoUrl] 
          properties:
            contentType:
              type: string
              description: Contenuto immagine
              enum: ["image"]
            photoUrl:
              type: string
              description: URL della risorsa immagine
              pattern: ^img_[a-z]+_\d+\.(jpg|jpeg|png)$
              minLength: 10
              maxLength: 50
      required:
        - messageId
        - chatId
        - state
        - senderId
        - createdAt
        - updatedAt
    
    Comment:
      type: object
      description: |-
        Rappresenta una reazione (commento) ad un messaggio, espressa tramite emoji.
      properties:
        commentId:
          type: string
          description: Identificatore univoco del commento
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
          example: "comm012334comm012334"
        messageId:
          type: string
          description: Identificatore del messaggio a cui il commento si riferisce
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
          example: "mess012345mess012345"
        emojiSent:
          type: string
          description: L'emoticon inviata come reazione
          example: "emoji_1234.jpg"
          pattern: '^[a-zA-Z0-9_]+\.(jpg|jpeg|png)$'
          minLength: 5
          maxLength: 50
        senderId:
          type: string
          description: L'ID dell'utente che ha creato il commento
          example: "user123456user123456"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
        createdAt:
          type: string
          description: Data e ora di creazione del commento
          format: date-time
      required:
        - commentId
        - messageId
        - emojiSent
        - senderId
        - createdAt
    
    Group:
      type: object
      description: Rappresenta un gruppo di conversazione
      properties:
        groupId:
          type: string
          description: Identificatore univoco del gruppo
          example: "group01234group01234"
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 20
          maxLength: 20
        groupName:
          type: string
          description: Nome visualizzato del gruppo
          example: "Programmazione Web"
          pattern: '^[\s\S]*$'
          minLength: 1
          maxLength: 25
        groupDescription:
          type: string
          description: Descrizione o topic del gruppo
          pattern: '^[\s\S]*$'
          example: "Gruppo del corso di Programmazione Web"
          minLength: 1
          maxLength: 50
        members:
          type: array
          description: Lista degli ID degli utenti che appartengono al gruppo
          minItems: 1
          maxItems: 500
          items:
            type: string
            description: L'ID dell'utente membro
            pattern: '^[a-zA-Z0-9]+$'
            minLength: 20
            maxLength: 20
          example: 
            - "abcdef0123abcdef0123"
            - "xyz9876543xyz9876543"
        createdAt:
          type: string
          description: Data e ora di creazione del gruppo
          format: date-time
        groupPhoto:
          type: string
          description: "ID o URL della risorsa immagine. Se null, l'utente non ha foto."
          example: "img_group_123456.jpg"
          pattern: '^img_[a-z]+_\d+\.(jpg|jpeg|png)$'
          minLength: 20
          maxLength: 50
      required:
        - groupId
        - groupName
        - members
        - createdAt

    Chat:
      type: object
      description: Rappresenta una conversazione completa (chat) con i suoi messaggi
      properties: 
        messages:  
          type: array
          description: Lista dei messaggi contenuti nella chat
          minItems: 0
          maxItems: 5000
          items:
            type: string
            description: l'id dei messaggi della chat
            pattern: '^[a-zA-Z0-9]+$'
            minLength: 20
            maxLength: 20
          example: 
            - "abcdef0123abcdef0123"
            - "xyz9876543xyz9876543"
        createdAt:
          type: string
          description: Data di creazione della chat
          format: date-time
        modifiedAt:
          type: string
          description: Timestamp dell'ultimo messaggio o modifica
          format: date-time
        lastMessage:
          $ref: '#/components/schemas/Message'
      required:
        - messages
        - createdAt
        - modifiedAt

    Error:
      type: object
      description: Schema standard per la comunicazione degli errori
      properties: 
        errorId:
          type: integer
          description: Codice numerico HTTP dell'errore
          example: 404
        error:
          type: string
          description: Messaggio descrittivo dell'errore
          example: "User not found"
          minLength: 1
          maxLength: 200
      required:
        - errorId
        - error
    
  parameters: 
    UserId:
      name: userId
      in: path
      description: Identificatore univoco dell'utente
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "abcdf01234abcdf01234"
        minLength: 20
        maxLength: 20
    GroupId:
      name: groupId
      in: path
      description: Identificatore univoco del gruppo
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "group12345group12345"
        minLength: 20
        maxLength: 20
    MemberId:
      name: memberId
      in: path
      description: Identificatore di un utente membro di un gruppo
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "mem1234567mem1234567"
        minLength: 20
        maxLength: 20
    ChatId:
      name: chatId
      in: path
      description: Identificatore univoco della chat
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "chat012345chat012345"
        minLength: 20
        maxLength: 20
    MessageId:
      name: messageId
      in: path
      description: Identificatore univoco del messaggio
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "msg0123456msg0123456"
        minLength: 20
        maxLength: 20
    CommentId: 
      name: commentId
      in: path
      description: Identificatore univoco del commento
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: "com0123456com0123456"
        minLength: 20
        maxLength: 20