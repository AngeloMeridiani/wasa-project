version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      - ./data:/datadb
    environment:
      - CFG_DB_FILENAME=/datadb/wasa.db
      - CFG_DEBUG=true
    networks:
      - wasa-network
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - wasa-network

networks:
  wasa-network:
    driver: bridge